name: Routine 2 - Export OTS vers Nostr (Midi)

on:
  schedule:
    # S'exécute chaque jour à 12:15 UTC
    - cron: '15 12 * * *'
  workflow_dispatch:     # Permet le déclenchement manuel

jobs:
  export-nostr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Nostr Dependency
        run: pip install nostr-sdk

      - name: Setup SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unneeded

      - name: Scan Host Keys
        run: ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: SSH & SCP Download Precise OTS Window
        run: |
          mkdir -p ./ots_downloaded
          
          # Bornes calculées strictement en UTC (millisecondes)
          TS_START=$(($(date -u -d "2 days ago 23:30" +%s) * 1000))
          TS_END=$(($(date -u -d "1 day ago 23:30" +%s) * 1000))
          
          echo "Plage UTC ciblée : $TS_START à $TS_END"

          # 1. Extrait la liste des fichiers distants
          ssh -p ${{ secrets.SSH_PORT || 22 }} -o BatchMode=yes ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} \
            "ls /root/xylem_data/archives/*.ots" | awk -v min="$TS_START" -v max="$TS_END" '{
              match($0, /[0-9]{13}/);
              ts = substr($0, RSTART, RLENGTH);
              if (ts >= min && ts < max) print $0;
            }' > ots_list.txt

          # 2. Téléchargement sécurisé via rsync
          if [ -s ots_list.txt ]; then
            rsync -avz -e "ssh -p ${{ secrets.SSH_PORT || 22 }} -o BatchMode=yes" \
              --files-from=ots_list.txt \
              ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/ ./ots_downloaded/
          else
            echo "⚠️ Aucun fichier trouvé dans la plage horaire."
          fi

          echo "Fichiers récupérés :"
          ls -1 ./ots_downloaded

      - name: Execute Nostr Publish Script
        env:
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
        run: python publish_nostr.py
