name: Routine 2 - Export OTS vers Nostr (Midi)

on:
  schedule:
    # S'exécute chaque jour à 12:15 UTC (aucun chevauchement avec 00:45 UTC)
    - cron: '15 12 * * *'
  workflow_dispatch:     # Permet le déclenchement manuel

jobs:
  export-nostr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Nostr Dependency
        run: pip install nostr

      # Utilisation du même mécanisme SSH que votre premier workflow
      - name: Setup SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unneeded

      - name: Scan Host Keys
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - - name: SSH & SCP Download Precise OTS Window
        run: |
          mkdir -p ./ots_downloaded
          
          # 1. Calcul des bornes temporelles exactes (23h30 J-2 et 23h30 J-1)
          START_TIME=$(date -d "2 days ago 23:30" '+%Y-%m-%d %H:%M:%S')
          END_TIME=$(date -d "1 day ago 23:30" '+%Y-%m-%d %H:%M:%S')
          
          echo "Fenêtre de recherche : de [$START_TIME] à [$END_TIME]"

          # 2. Recherche distante des fichiers .ots créés entre ces deux dates
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} \
            "find /root/xylem_data/archives -maxdepth 1 -name '*.ots' -newermt '$START_TIME' ! -newermt '$END_TIME'" > ots_list.txt

          # 3. Téléchargement exclusif du lot
          cat ots_list.txt | while read file; do
            [ -n "$file" ] && scp -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:"$file" ./ots_downloaded/
          done

          # 4. Vérification dans les logs
          echo "Nombre de fichiers OTS récupérés :"
          ls -1 ./ots_downloaded | wc -l
          
      - name: Execute Nostr Publish Script
        env:
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
        run: python publish_nostr.py ./ots_downloaded
