name: Routine 2 - Export OTS vers Nostr (Midi)

on:
  schedule:
    # S'exécute chaque jour à 12:15 UTC
    - cron: '15 12 * * *'
  workflow_dispatch:     # Permet le déclenchement manuel

jobs:
  export-nostr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Nostr Dependency
        run: pip install nostr-sdk

      - name: Setup SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unneeded

      - name: Scan Host Keys
        run: ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: SSH, Parse Logs & Download 24 OTS Files
        run: |
          mkdir -p ./ots_downloaded
          
          # Bornes calculées en UTC (millisecondes)
          TS_START=$(($(date -u -d "2 days ago 23:30" +%s) * 1000))
          TS_END=$(($(date -u -d "1 day ago 23:30" +%s) * 1000))
          
          echo "Plage UTC ciblée : $TS_START à $TS_END"

          # 1. SSH : Extrait les CIDs et Noms depuis /root/xylem_node/log_cron.txt
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} \
            "awk -v min=\"$TS_START\" -v max=\"$TS_END\" '
              /SCAN XYLEM \(Unix: [0-9]+\)/ {
                match(\$0, /[0-9]{13}/);
                ts = substr(\$0, RSTART, RLENGTH);
                in_range = (ts >= min && ts < max);
              }
              in_range && /IPFS CID LOCAL/ {
                match(\$0, /\{.*\}/);
                print substr(\$0, RSTART, RLENGTH);
              }
            ' /root/xylem_node/log_cron.txt" > ipfs_index.jsonl

          # Affichage de contrôle dans les logs GitHub
          echo "--- Index JSONL extrait ---"
          cat ipfs_index.jsonl
          echo "---------------------------"

          # 2. Vérification si des fichiers ont été trouvés
          if [ -s ipfs_index.jsonl ]; then
            # Génère les chemins relatifs depuis /root/xylem_data/archives/
            jq -r '.Name' ipfs_index.jsonl | sed 's/$/ .ots/' > ots_list.txt
            
            echo "--- Liste des .ots à télécharger ---"
            cat ots_list.txt
            echo "------------------------------------"

            # 3. Téléchargement scp/rsync ciblé depuis le dossier archives
            rsync -avz \
              --files-from=ots_list.txt \
              ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/root/xylem_data/archives/ \
              ./ots_downloaded/
          else
            echo "⚠️ Aucun log trouvé dans la plage horaire $TS_START - $TS_END."
          fi

          echo "Fichiers récupérés dans ./ots_downloaded :"
          ls -1 ./ots_downloaded

      - name: Execute Nostr Publish Script
        env:
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
        run: python publish_nostr.py
