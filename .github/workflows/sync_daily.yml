name: Sync Daily Log from Swiss Server

on:
  schedule:
    - cron: '45 0 * * *' # S'exécute chaque nuit à 00:45 UTC (15 min après ton compilateur)
  workflow_dispatch: # Permet de lancer un test manuellement quand tu veux

jobs:
  sync-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Calculate Yesterday's Date
        id: dates
        run: |
          YESTERDAY=$(date -d "yesterday" '+%Y-%m-%d')
          echo "file_name=page-${YESTERDAY}.html" >> $GITHUB_OUTPUT

      - name: Setup SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'placeholder'

      - name: Scan Host Keys
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: SCP Download to Root
        run: |
          # Récupère la page de la veille depuis le serveur suisse
          scp ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/root/xylem_data/public_html/${{ steps.dates.outputs.file_name }} ./

      - name: Commit and Push
        run: |
          git config --global user.name "Xylem Node Bot"
          git config --global user.email "bot@xylem.local"
          git add ${{ steps.dates.outputs.file_name }}
          # Ne commit que s'il y a une différence réelle avec le fichier existant
          git diff-index --quiet HEAD || git commit -m "🔒 Dynamic anchor: ${{ steps.dates.outputs.file_name }}"
          git push
