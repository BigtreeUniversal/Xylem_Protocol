<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ XYLEM MOBILE MIRROR ]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #010402; color: #00ff66; font-family: monospace; }
        .box { border: 1px solid #00cc55; background: rgba(0, 10, 3, 0.5); }
        .brand-btn { 
            border: 1px solid #00cc55; 
            color: #00ff66; 
            background: rgba(0,30,10,0.6); 
            padding: 6px 10px; 
            font-weight: bold; 
            font-size: 11px; 
            display: inline-block;
            text-align: center;
        }
        .brand-btn:active, .brand-btn:hover { background: #00ff66; color: #010402; }
        
        /* Style distinctif pour le bouton Miroir (Accès Rapide) */
        .brand-btn-mirror {
            border-color: #38bdf8;
            color: #38bdf8;
            background: rgba(14, 116, 144, 0.3);
        }
        .brand-btn-mirror:active, .brand-btn-mirror:hover { background: #38bdf8; color: #010402; }
    </style>
</head>
<body class="p-3 sm:p-6">
<div class="max-w-3xl mx-auto">

    <!-- BARRE SUPERIEURE & NAVIGATION -->
    <div class="flex justify-between items-center mb-4 border-b border-emerald-500/40 pb-3">
        <a href="index.html" class="brand-btn text-xs">← HUB INDEX</a>
        <h1 class="text-sm font-bold text-emerald-400">[ XYLEM // MIRROR ]</h1>
        <span id="status-badge" class="text-xs px-2 py-1 bg-emerald-950 text-emerald-400 border border-emerald-800">SCANNING...</span>
    </div>

    <!-- METADATA EN TÊTE (Day, Root Hash, Parent Hash) -->
    <div id="meta-box" class="box p-3 text-xs leading-relaxed mb-4 hidden">
        <p><span class="text-emerald-600">> DAY    :</span> <span id="meta-day" class="text-white font-bold">--</span></p>
        <p><span class="text-emerald-600">> ROOT   :</span> <span id="meta-root" class="text-emerald-300 break-all select-all">--</span></p>
        <p><span class="text-emerald-600">> PARENT :</span> <span id="meta-parent" class="text-emerald-500/70 break-all select-all">--</span></p>
    </div>

    <!-- FEED MOBILE (24 Cartes générées à la volée) -->
    <div id="cards-container" class="space-y-3">
        <!-- Les cartes s'injectent ici -->
    </div>

</div>

<script>
    // --- CONFIGURATION ---
    const GITHUB_USER = "TON_PSEUDO"; // Ton pseudo GitHub (si besoin de fallback API)
    const GITHUB_REPO = "xylem.bigtreeconnection.com";

    // URL du domaine R2 contenant le dossier d'archivage des images
    const WORKER_MIRROR_URL = "https://database.bigtreeconnection.com/xylem-protocol-mirror/Archive_data/";

    // 1. Détection du fichier dans l'URL (?log=page-2026-07-25.html)
    const urlParams = new URLSearchParams(window.location.search);
    const requestedLog = urlParams.get('log');

    // 2. Initialisation
    async function init() {
        let fileToFetch = requestedLog;

        // Si aucun paramètre n'est fourni, on cherche la page la plus récente sur GitHub
        if (!fileToFetch) {
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`);
                const files = await res.json();

                const logFiles = files
                    .filter(f => f.name.startsWith('page-') && f.name.endsWith('.html'))
                    .sort((a, b) => b.name.localeCompare(a.name));

                if (logFiles.length > 0) fileToFetch = logFiles[0].name;
            } catch (err) {
                document.getElementById('status-badge').innerText = "ERROR_API";
                return;
            }
        }

        if (fileToFetch) {
            parseAndRenderLog(fileToFetch);
        } else {
            document.getElementById('status-badge').innerText = "NO_LOGS_FOUND";
        }
    }

    // 3. Parser HTML & Extraction des données
    async function parseAndRenderLog(fileName) {
        const badge = document.getElementById('status-badge');
        badge.innerText = "LOADING...";

        try {
            // Télécharge le fichier HTML du jour situé sur xylem.bigtreeconnection.com
            const response = await fetch(fileName);
            if (!response.ok) throw new Error("Fichier introuvable");

            const rawHtml = await response.text();

            const parser = new DOMParser();
            const doc = parser.parseFromString(rawHtml, "text/html");

            // Extraction des Métadonnées (Day, Root, Parent)
            const boxElements = doc.querySelectorAll(".box p");
            boxElements.forEach(p => {
                const text = p.textContent;
                if (text.includes("DAY")) {
                    document.getElementById("meta-day").innerText = p.querySelector("span:last-child")?.textContent || fileName;
                }
                if (text.includes("ROOT")) {
                    document.getElementById("meta-root").innerText = p.querySelector("span:last-child")?.textContent || "--";
                }
                if (text.includes("PARENT")) {
                    document.getElementById("meta-parent").innerText = p.querySelector("span:last-child")?.textContent || "--";
                }
            });
            document.getElementById("meta-box").classList.remove("hidden");

            // Extraction des 24 entrées du tableau
            const rows = doc.querySelectorAll("tbody tr");
            const container = document.getElementById("cards-container");
            container.innerHTML = "";

            rows.forEach(row => {
                const cols = row.querySelectorAll("td");
                if (cols.length >= 5) {
                    const imageName = cols[0].textContent.trim(); // Ex: image_14h.jpg
                    const cid = cols[1].textContent.trim();
                    const time = cols[2].textContent.trim();
                    const status = cols[3].textContent.trim();
                    const ipfsUrl = cols[4].querySelector("a")?.getAttribute("href") || `#`;

                    // Génération du lien direct vers Cloudflare R2 sur database.bigtreeconnection.com
                    const mirrorUrl = WORKER_MIRROR_URL + imageName;

                    const shortCid = cid.length > 16 ? cid.substring(0, 8) + "..." + cid.substring(cid.length - 8) : cid;

                    const card = document.createElement("div");
                    card.className = "box p-3 space-y-2 text-xs";
                    card.innerHTML = `
                        <div class="flex justify-between items-start border-b border-emerald-900/60 pb-2">
                            <span class="font-bold text-emerald-400 break-all">${imageName}</span>
                            <span class="text-[10px] text-emerald-600 shrink-0 ml-2">${time}</span>
                        </div>
                        <div class="text-emerald-300 font-mono text-[11px] break-all">
                            <span class="text-emerald-700">CID:</span> ${shortCid}
                        </div>
                        <div class="flex justify-between items-center pt-1 gap-2">
                            <span class="text-[10px] text-emerald-500 font-bold">${status}</span>
                            <div class="flex gap-1.5">
                                <a href="${mirrorUrl}" target="_blank" class="brand-btn brand-btn-mirror">🚀 MIRROR</a>
                                <a href="${ipfsUrl}" target="_blank" class="brand-btn">OPEN IPFS</a>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });

            badge.innerText = "ONLINE";
            badge.className = "text-xs px-2 py-1 bg-emerald-900 text-emerald-300 border border-emerald-600";

        } catch (error) {
            console.error(error);
            badge.innerText = "PARSE_ERROR";
            badge.className = "text-xs px-2 py-1 bg-red-950 text-red-400 border border-red-800";
        }
    }

    document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
