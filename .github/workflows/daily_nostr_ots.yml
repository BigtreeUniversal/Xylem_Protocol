name: Routine 2 - Export OTS vers Nostr (Midi)

on:
  schedule:
    # S'exécute chaque jour à 12:15 UTC (aucun chevauchement avec 00:45 UTC)
    - cron: '15 12 * * *'
  workflow_dispatch:     # Permet le déclenchement manuel

jobs:
  export-nostr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Nostr Dependency
        run: pip install nostr

      # Utilisation du même mécanisme SSH que votre premier workflow
      - name: Setup SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unneeded

      - name: Scan Host Keys
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: SSH & SCP Download Precise OTS Window (Unix Timestamp)
        run: |
          mkdir -p ./ots_downloaded
          
          # 1. Calcul des bornes Unix en millisecondes (13 chiffres) pour 23h30 J-2 et 23h30 J-1
          TS_START=$(($(date -d "2 days ago 23:30" +%s) * 1000))
          TS_END=$(($(date -d "1 day ago 23:30" +%s) * 1000))
          
          echo "Recherche des timestamps entre $TS_START et $TS_END"

          # 2. Filtrage distant : extrait le timestamp 13 chiffres de xylem_xxxx.jpg.ots
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} \
            "ls /root/xylem_data/archives/*.ots | awk -v min=\"$TS_START\" -v max=\"$TS_END\" '{
              match(\$0, /[0-9]{13}/);
              ts = substr(\$0, RSTART, RLENGTH);
              if (ts >= min && ts < max) print \$0;
            }'" > ots_list.txt

          # 3. Téléchargement ciblé des fichiers .ots
          cat ots_list.txt | while read file; do
            [ -n "$file" ] && scp -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:"$file" ./ots_downloaded/
          done

          # 4. Contrôle dans les logs GitHub
          echo "Fichiers OTS récupérés :"
          ls -1 ./ots_downloaded
          
      - name: Execute Nostr Publish Script
        env:
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
        run: python publish_nostr.py
