name: Sync Daily Log and Update Xylem Oracle

on:
  schedule:
    - cron: '45 0 * * *' # Exécution quotidienne à 00:45 UTC
  workflow_dispatch:     # Déclenchement manuel sécurisé

permissions:
  contents: write

jobs:
  sync-and-anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Calculate Yesterday Date (Strict UTC)
        id: dates
        run: |
          YESTERDAY=$(date -u -d "yesterday" '+%Y-%m-%d')
          echo "yesterday_date=${YESTERDAY}" >> $GITHUB_OUTPUT
          echo "file_name=page-${YESTERDAY}.html" >> $GITHUB_OUTPUT

      - name: Setup SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unneeded

      - name: Scan Host Keys
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: SCP Download Log HTML
        run: |
          scp ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/root/xylem_data/public_html/${{ steps.dates.outputs.file_name }} ./

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install ethers

      - name: Execute Oracle Anchor Script
        env:
          OPERATOR_PRIVATE_KEY: ${{ secrets.OPERATOR_PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          RPC_URL: "https://mainnet.base.org"
          TARGET_DAY: ${{ steps.dates.outputs.yesterday_date }}
          TARGET_FILE: ${{ steps.dates.outputs.file_name }}
        run: node scripts/updateOracle.js

      - name: Commit and Push HTML Log (Uniquement si ancrage réussi)
        run: |
          git config --global user.name "Xylem Node Bot"
          git config --global user.email "bot@xylem.local"
          git add ${{ steps.dates.outputs.file_name }}
          git diff-index --quiet HEAD || git commit -m "🔒 Dynamic anchor: ${{ steps.dates.outputs.file_name }}"
          git push
